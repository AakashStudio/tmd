<!-- CINEMATIC 3D WEBGL HERO CANVAS (GetLayers AI & Scrolltide style) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cinematic Hero Preview</title>
  <script src="../assets/js/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; background-color: #030712; overflow: hidden; color: white; font-family: sans-serif; }
    #canvas-container { position: absolute; inset: 0; z-index: 0; }
    .hero-content { position: relative; z-index: 10; pointer-events: none; }
    .interactive { pointer-events: auto; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">

  <div id="canvas-container"></div>

  <div class="hero-content text-center max-w-3xl px-6">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/20 border border-violet-500/30 text-violet-300 text-xs font-semibold mb-4">
      <span>✦ Powered by GetLayers AI & Three.js</span>
    </div>
    <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white leading-tight">
      Turn Prompts Into <br>
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-300 to-cyan-400">Cinematic 3D Reality</span>
    </h1>
    <p class="mt-4 text-sm sm:text-base text-slate-400 max-w-xl mx-auto">
      Move your cursor across the screen to feel the interactive 3D particle mesh react in real-time.
    </p>
    <div class="mt-8 flex justify-center gap-4 interactive">
      <button class="px-6 py-3 rounded-full text-xs font-bold text-white bg-gradient-to-r from-violet-600 to-indigo-600 hover:scale-105 transition shadow-lg shadow-violet-500/30">
        Explore 3D Library
      </button>
      <button class="px-6 py-3 rounded-full text-xs font-medium text-slate-300 bg-slate-900/80 border border-slate-800 hover:bg-slate-800 transition">
        View Source Code
      </button>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Create 3D Torus Knot Geometry
    const geometry = new THREE.TorusKnotGeometry(8, 2.2, 120, 24);
    const material = new THREE.MeshNormalMaterial({ wireframe: true });
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);

    // Mouse tracking
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - windowHalfX) * 0.0015;
      mouseY = (e.clientY - windowHalfY) * 0.0015;
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      torusKnot.rotation.x += 0.005 + targetY;
      torusKnot.rotation.y += 0.008 + targetX;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
